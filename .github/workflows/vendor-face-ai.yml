name: Vendor Face Detection AI Assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-face-ai.yml'

permissions:
  contents: write

concurrency:
  group: facekeep-vendor-ai
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned MediaPipe package and model files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/wasm vendor/models /tmp/facekeep-package
          cd /tmp/facekeep-package
          npm pack @mediapipe/tasks-vision@0.10.35 --silent
          tar -xzf mediapipe-tasks-vision-0.10.35.tgz
          cd "$GITHUB_WORKSPACE"
          cp /tmp/facekeep-package/package/vision_bundle.mjs vendor/vision_bundle.mjs
          cp /tmp/facekeep-package/package/wasm/vision_wasm_internal*.js vendor/wasm/
          cp /tmp/facekeep-package/package/wasm/vision_wasm_internal*.wasm vendor/wasm/
          if [ -f /tmp/facekeep-package/package/LICENSE ]; then cp /tmp/facekeep-package/package/LICENSE vendor/LICENSE.txt; fi
          curl -fLsS --retry 3 --retry-delay 3 \
            https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite \
            -o vendor/models/full_range.tflite
          curl -fLsS --retry 3 --retry-delay 3 \
            https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite \
            -o vendor/models/short_range.tflite
          curl -fLsS --retry 3 --retry-delay 3 \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task \
            -o vendor/models/face_landmarker.task
          test -s vendor/models/face_landmarker.task
          test -s vendor/models/full_range.tflite
          test -s vendor/models/short_range.tflite
          test -s vendor/vision_bundle.mjs
          test -s vendor/wasm/vision_wasm_internal.wasm
          ls -lh vendor/ vendor/models/ vendor/wasm/
      - name: Commit bundled AI assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if ! git diff --cached --quiet; then
            git commit -m "build: vendor MediaPipe face detection and landmarker assets"
            git push origin HEAD:main
          else
            echo 'AI assets already up to date'
          fi
