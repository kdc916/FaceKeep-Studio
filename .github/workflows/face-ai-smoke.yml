name: FaceKeep AI Browser Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/face-ai-smoke.yml'
      - 'qa/face-ai-smoke.mjs'
      - 'qa/portrait-layout-smoke.mjs'
      - 'qa/panorama-small-faces.mjs'
      - 'index.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download public test image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          curl -fLsS --retry 3 https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg -o qa/lena.jpg
          test -s qa/lena.jpg
          curl -fLsS --retry 2 https://storage.googleapis.com/mediapipe-tasks/hand_landmarker/woman_hands.jpg -o qa/hands.jpg
          test -s qa/hands.jpg
      - name: Install browser test dependencies
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          which google-chrome || which google-chrome-stable || which chromium
      - name: Test local AI runtime
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/facekeep-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          node qa/face-ai-smoke.mjs
          node qa/portrait-layout-smoke.mjs
          node qa/panorama-small-faces.mjs
